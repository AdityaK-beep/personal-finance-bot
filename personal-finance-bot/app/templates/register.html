{% extends "base.html" %}

{% block title %}Register - Personal Finance Advisor Bot{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center py-4 py-md-5">
  <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
    <div class="glass-card p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="brand-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.5rem;">₹</div>
        <h1 class="h3 fw-bold mb-1">Create Account</h1>
        <p class="text-muted small">Begin your journey towards data-driven personal wealth.</p>
      </div>

      <form method="POST" action="{{ url_for('auth.register') }}">
        <div class="mb-3">
          <label for="username" class="form-label form-label-custom">Full Name / Username</label>
          <input 
            type="text" 
            class="form-control form-control-custom" 
            id="username" 
            name="username" 
            value="{{ username or '' }}" 
            placeholder="e.g. Alex Sharma" 
            required 
            minlength="2" 
            maxlength="80" 
            autocomplete="name"
          >
        </div>

        <div class="mb-3">
          <label for="email" class="form-label form-label-custom">Email Address</label>
          <input 
            type="email" 
            class="form-control form-control-custom" 
            id="email" 
            name="email" 
            value="{{ email or '' }}" 
            placeholder="alex@example.com" 
            required 
            autocomplete="email"
          >
        </div>

        <div class="mb-3">
          <label for="password" class="form-label form-label-custom">Password (min 6 characters)</label>
          <input 
            type="password" 
            class="form-control form-control-custom" 
            id="password" 
            name="password" 
            placeholder="••••••••" 
            required 
            minlength="6" 
            autocomplete="new-password"
          >
        </div>

        <div class="mb-4">
          <label for="confirm_password" class="form-label form-label-custom">Confirm Password</label>
          <input 
            type="password" 
            class="form-control form-control-custom" 
            id="confirm_password" 
            name="confirm_password" 
            placeholder="••••••••" 
            required 
            minlength="6" 
            autocomplete="new-password"
          >
        </div>

        <button type="submit" class="btn btn-primary-custom w-100 py-2">
          Create Free Account
        </button>
      </form>

      <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25">
        <span class="text-muted small">Already registered?</span>
        <a href="{{ url_for('auth.login') }}" class="text-decoration-none fw-semibold ms-1" style="color: var(--accent);">Log In here</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
