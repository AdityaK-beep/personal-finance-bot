{% extends "base.html" %}

{% block title %}Login - Personal Finance Advisor Bot{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center py-4 py-md-5">
  <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
    <div class="glass-card p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="brand-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.5rem;">₹</div>
        <h1 class="h3 fw-bold mb-1">Welcome Back</h1>
        <p class="text-muted small">Sign in to access your financial dashboard and AI insights.</p>
      </div>

      <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
        <div class="mb-3">
          <label for="email" class="form-label form-label-custom">Email Address</label>
          <input 
            type="email" 
            class="form-control form-control-custom" 
            id="email" 
            name="email" 
            value="{{ email or '' }}" 
            placeholder="you@example.com" 
            required 
            autocomplete="email"
          >
        </div>

        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label for="password" class="form-label form-label-custom mb-0">Password</label>
          </div>
          <input 
            type="password" 
            class="form-control form-control-custom" 
            id="password" 
            name="password" 
            placeholder="••••••••" 
            required 
            autocomplete="current-password"
          >
        </div>

        <div class="form-check mb-4">
          <input class="form-check-input bg-dark border-secondary" type="checkbox" name="remember" id="remember">
          <label class="form-check-label text-muted small" for="remember">
            Remember this session
          </label>
        </div>

        <button type="submit" class="btn btn-primary-custom w-100 py-2">
          Sign In
        </button>
      </form>

      <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25">
        <span class="text-muted small">Don't have an account yet?</span>
        <a href="{{ url_for('auth.register') }}" class="text-decoration-none fw-semibold ms-1" style="color: var(--accent);">Create one now</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
